{% extends "base.html" %}

{% block title %}Registrar Usuario — Dietética Natural{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center py-6">
    <div class="w-full max-w-md bg-white p-8 rounded-2xl shadow-sm border border-slate-200">
        <!-- Encabezado -->
        <div class="text-center mb-6">
            <span class="inline-flex p-3 rounded-2xl bg-emerald-50 text-emerald-700 text-3xl mb-2">📝</span>
            <h2 class="text-2xl font-bold text-slate-800">Crear Nueva Cuenta</h2>
            <p class="text-sm text-slate-500 mt-1">Alta de operador para gestión de inventario</p>
        </div>

        <!-- Formulario -->
        <form method="POST" action="{{ url_for('auth.register') }}" class="space-y-4">
            <div>
                <label for="username" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">
                    Nombre de Usuario
                </label>
                <input type="text" id="username" name="username" required autofocus
                       placeholder="ej. juan_dietetica"
                       class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent text-sm">
            </div>

            <div>
                <label for="email" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">
                    Correo Electrónico
                </label>
                <input type="email" id="email" name="email" required
                       placeholder="operador@dietetica.com"
                       class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent text-sm">
            </div>

            <div>
                <label for="password" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">
                    Contraseña (mínimo 6 caracteres)
                </label>
                <input type="password" id="password" name="password" required minlength="6"
                       placeholder="••••••••"
                       class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent text-sm">
            </div>

            <div>
                <label for="confirm_password" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">
                    Confirmar Contraseña
                </label>
                <input type="password" id="confirm_password" name="confirm_password" required minlength="6"
                       placeholder="••••••••"
                       class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent text-sm">
            </div>

            <button type="submit"
                    class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2.5 px-4 rounded-xl shadow-sm transition-colors text-sm">
                Registrar Usuario
            </button>
        </form>

        <div class="mt-6 pt-5 border-t border-slate-100 text-center">
            <p class="text-xs text-slate-500">
                ¿Ya tenés cuenta?
                <a href="{{ url_for('auth.login') }}" class="text-emerald-600 font-medium hover:underline">Iniciá sesión</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
