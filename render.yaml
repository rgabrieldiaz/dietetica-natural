services:
  - type: web
    name: dietetica-natural-mvp
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python train_model.py"
    startCommand: "gunicorn run:app"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: dietetica-postgres-db
          property: connectionString

databases:
  - name: dietetica-postgres-db
    plan: free
    databaseName: dietetica
    user: dietetica_user
